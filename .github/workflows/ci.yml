name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact: minical-linux-x86_64
          - os: macos-latest
            artifact: minical-macos-arm64
          - os: windows-latest
            artifact: minical-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # ---- Ninja (Linux / macOS) ----
      - uses: seanmiddleditch/gha-setup-ninja@v5
        if: runner.os != 'Windows'

      # ---- Ubuntu: 确保使用 GCC 14 ----
      - name: Select GCC 14 (Linux)
        if: runner.os == 'Linux'
        run: |
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # ---- macOS: 安装 GCC 14 (Apple Clang 的 libc++ 不支持 <print>) ----
      - name: Install GCC 14 (macOS)
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install gcc@14
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # ---- 配置 ----
      - name: Configure (Linux / macOS)
        if: runner.os != 'Windows'
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release

      # ---- 构建 ----
      - name: Build
        run: cmake --build build --config Release

      # ---- 只跑我们自己的测试, 排除 GoogleTest / Benchmark 自带的 ----
      - name: Test (Linux / macOS)
        if: runner.os != 'Windows'
        run: ctest --test-dir build -R cal_test --output-on-failure

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release -R cal_test --output-on-failure

      # ---- 上传 ----
      - name: Upload artifact (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build/minical

      - name: Upload artifact (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: build\Release\minical.exe

  # -------------------------------------------------------------------
  # 推送 tag 时创建 Release
  # -------------------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: minical-*
          merge-multiple: true
          path: release

      - name: Generate checksums
        run: cd release && sha256sum * > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
